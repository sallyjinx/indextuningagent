[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-autonomous-tuning"
version = "1.0.0"
description = "Reproducible PostgreSQL 16 budget-constrained index tuning experiment"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1,<4", "httpx>=0.27,<1", "matplotlib>=3.8,<4"]

[project.scripts]
pg-tuning = "pg_tuning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
